name: commitlint

# PRs are squash-merged with the PR title as the whole commit message on main
# (the description stays on the PR), so lint the title only.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-message:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint PR title
        # Passed via env so PR text can't inject shell.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          npm install --no-save @commitlint/cli@19 @commitlint/config-conventional@19
          printf '%s\n' "$TITLE" | npx commitlint --config .github/commitlint.yml
